<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Avatar</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 520px; margin: 40px auto; padding: 0 16px; }
  #face { width: 160px; height: 160px; border-radius: 50%; background: #f5c99b; position: relative; margin: 16px 0; }
  .eye { position: absolute; top: 50px; width: 16px; height: 16px; background: #333; border-radius: 50%; }
  #mouth { position: absolute; left: 50%; top: 105px; transform: translateX(-50%); background: #7a1f1f; transition: all 60ms; }
  #mouth[data-shape=rest]   { width: 44px; height: 6px;  border-radius: 3px; }
  #mouth[data-shape=closed] { width: 44px; height: 3px;  border-radius: 2px; }
  #mouth[data-shape=open]   { width: 36px; height: 30px; border-radius: 50%; }
  #mouth[data-shape=wide]   { width: 56px; height: 14px; border-radius: 8px; }
  #mouth[data-shape=round]  { width: 22px; height: 24px; border-radius: 50%; }
  #mouth[data-shape=teeth]  { width: 44px; height: 10px; border-radius: 2px; border-top: 4px solid #fff; }
  #mouth[data-shape=tongue] { width: 40px; height: 16px; border-radius: 8px; border-bottom: 6px solid #e06666; }
  textarea { width: 100%; height: 60px; }
</style>
</head>
<body>
<h1>Avatar</h1>
<label for="text">What should the avatar say?</label>
<textarea id="text">Hello there</textarea>
<button id="speak">Speak</button>
<div id="face" aria-label="Avatar face">
  <div class="eye" style="left:45px"></div><div class="eye" style="right:45px"></div>
  <div id="mouth" data-shape="rest" data-testid="mouth"></div>
</div>
<p id="status" role="status">Idle</p>
<script>
const mouth = document.getElementById("mouth"), status = document.getElementById("status");
document.getElementById("speak").onclick = async () => {
  status.textContent = "Rendering…";
  const r = await fetch("/api/render", { method: "POST", body: JSON.stringify({ text: document.getElementById("text").value }) });
  const { frames, frame_ms, count } = await r.json();
  status.textContent = `Speaking (${count} frames)`;
  for (const f of frames) { mouth.dataset.shape = f; await new Promise(res => setTimeout(res, frame_ms)); }
  mouth.dataset.shape = "rest";
  status.textContent = `Done: ${count} frames`;
};
</script>
</body>
</html>
