# Mealie (mealie-recipes/mealie): FastAPI backend (Python 3.12, uv) + Nuxt frontend (pnpm).
# Written from the repo's Taskfile (setup:py, setup:ui, py, ui) and .devcontainer. Defaults to SQLite.
version: 1
runtime:
  node: "22"
workdir: .
env:
  # Runloop points uv/pip at its own package mirror, which omits upload dates; Mealie's
  # exclude-newer cooling period then filters out every package. Use PyPI directly.
  UV_DEFAULT_INDEX: https://pypi.org/simple
  # Mealie defaults to production (data in /app/data, which a non-root user can't create).
  # Developers set this in an untracked .env; dev mode keeps data in dev/data inside the repo.
  PRODUCTION: "false"
setup:
  # Build deps for packages compiled from source (python-ldap, psycopg), as in docker/Dockerfile,
  # plus libsqlite3-0: the image's Python needs it for sqlite3 but the image lacks it.
  - sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends build-essential libpq-dev libwebp-dev libsasl2-dev libldap2-dev libssl-dev libsqlite3-0
  - sudo npm install -g pnpm@11                           # not in the default image
  - curl -LsSf https://astral.sh/uv/install.sh | sh       # not in the default image
  - ~/.local/bin/uv sync --frozen                         # exactly the lockfile; re-resolving trips over exclude-newer
  - cd frontend && pnpm install --frozen-lockfile
# Two processes: backend on :9000 in the background, frontend (the page a browser loads) on :3000.
start: |
  ~/.local/bin/uv run python mealie/app.py &
  cd frontend && pnpm dev --host 0.0.0.0 --port 3000
port: 3000
ready:
  path: /api/app/about    # proxied by the frontend to the backend: 200 only when both are up
  timeout_seconds: 600
# Test accounts. Mealie creates the admin itself on first start (mealie/core/settings/settings.py,
# _DEFAULT_EMAIL / _DEFAULT_PASSWORD); the regular member is created through the admin API once the app is up.
personas:
  admin:
    description: Mealie's built-in administrator; can manage users, groups and every recipe
    username: changeme@example.com
    password: MyPassword
  cook:
    description: A regular household member without admin rights
    username: cook@example.com
    password: { secret: GT_MEALIE_COOK_PASSWORD }
after_ready:
  - >-
    TOKEN=$(curl -sf -X POST localhost:9000/api/auth/token --data-urlencode "username=$GT_PERSONA_ADMIN_USERNAME"
    --data-urlencode "password=$GT_PERSONA_ADMIN_PASSWORD" | sed -E 's/.*"access_token":"([^"]+)".*/\1/') &&
    curl -sf -X POST localhost:9000/api/admin/users -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json'
    -d "{\"username\":\"cook\",\"fullName\":\"Cook\",\"email\":\"$GT_PERSONA_COOK_USERNAME\",\"password\":\"$GT_PERSONA_COOK_PASSWORD\",\"group\":\"Home\",\"household\":\"Family\"}"
    -o /dev/null -w 'created cook: HTTP %{http_code}\n'
  # Prove the new account can log in.
  - >-
    curl -sf -X POST localhost:9000/api/auth/token --data-urlencode "username=$GT_PERSONA_COOK_USERNAME"
    --data-urlencode "password=$GT_PERSONA_COOK_PASSWORD" -o /dev/null -w 'cook login: HTTP %{http_code}\n'
