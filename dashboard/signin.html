<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Groundtruth</title>
<link rel="icon" href="gt-mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
<script type="module" src="js/signin.js"></script>
</head>
<body>
<div class="list-page">
  <header class="list-top">
    <span class="brandlink"><img src="gt-mark.svg" width="31" height="31" alt=""><strong>Groundtruth</strong></span>
  </header>
  <main class="signin">
    <h1>Sign in</h1>
    <form id="signin" class="signin-card" novalidate>
      <label for="token">Your token</label>
      <input id="token" name="token" type="password" autocomplete="current-password" spellcheck="false" required>
      <p class="hint">Paste the token you were given. This browser stays signed in for 30 days.</p>
      <button type="submit">Sign in</button>
      <p id="said" class="said-error" role="alert" hidden></p>
    </form>
  </main>
</div>
<noscript><p class="state">Signing in needs JavaScript.</p></noscript>
</body>
</html>
